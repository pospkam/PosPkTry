name: Cron — AI Agents (Watchdog / Editor / Scout)

on:
  schedule:
    - cron: '12,42 * * * *'   # Watchdog: каждые 30 мин
    - cron: '0 2 * * *'       # Editor: ежедневно в 02:00 UTC
    - cron: '0 7 * * *'       # Scout Digest: ежедневно в 07:00 UTC
  workflow_dispatch:           # ручной запуск

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '12,42 * * * *'
    steps:
      - name: Watchdog — мониторинг платформы
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set — skipping"; exit 0; fi
          HTTP=$(curl -s -o /tmp/watchdog.json -w "%{http_code}" --max-time 60 \
            "https://tourhab.ru/api/cron/watchdog?secret=$CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/watchdog.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "Watchdog OK" || { echo "HTTP $HTTP"; exit 1; }

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 2 * * *'
    steps:
      - name: Editor — AI улучшение описаний туров
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          HTTP=$(curl -s -o /tmp/editor.json -w "%{http_code}" --max-time 300 \
            "https://tourhab.ru/api/cron/editor?secret=$CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/editor.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "Editor OK" || { echo "HTTP $HTTP"; exit 1; }

  scout-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 7 * * *'
    steps:
      - name: Scout Digest — ежедневный дайджест
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then exit 0; fi
          HTTP=$(curl -s -o /tmp/scout.json -w "%{http_code}" --max-time 120 \
            "https://tourhab.ru/api/cron/scout-digest?secret=$CRON_SECRET")
          echo "HTTP: $HTTP" && cat /tmp/scout.json 2>/dev/null || true
          [ "$HTTP" = "200" ] && echo "Scout OK" || { echo "HTTP $HTTP"; exit 1; }
