name: Evolution Loop - AI Board Meeting

on:
  schedule:
    # Запуск 1 раз в день в 21:00 UTC = 09:00 по Камчатке
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no real changes)'
        required: false
        default: 'false'

jobs:
  evolution:
    runs-on: ubuntu-latest
    name: 🌀 Evolution Loop
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🌀 Start Evolution Loop
        run: node scripts/evolution-runner.js
        env:
          TOURHAB_URL: ${{ secrets.TOURHAB_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

      - name: 🔔 Notify Telegram on success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Evolution Loop: SUCCESS
            Board Meeting completed, initiatives processed.
          disable_web_page_preview: true

      - name: 🔴 Notify Telegram on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Evolution Loop: FAILED
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          disable_web_page_preview: true
