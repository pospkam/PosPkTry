name: Execute Initiatives - Create PRs

on:
  schedule:
    # Every hour (was every 15 min — reduced to avoid spam)
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      initiative_id:
        description: 'Optional: specific initiative ID to execute'
        required: false

jobs:
  execute:
    runs-on: ubuntu-latest
    name: 🚀 Execute Approved Initiatives
    timeout-minutes: 5

    steps:
      - name: Execute approved initiatives via API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set in GitHub secrets — skipping"
            exit 0
          fi

          HTTP=$(curl -s -o /tmp/exec_resp.json -w "%{http_code}" \
            --max-time 240 \
            "https://tourhab.ru/api/cron/initiatives-execute?secret=$CRON_SECRET")

          echo "HTTP: $HTTP"
          cat /tmp/exec_resp.json 2>/dev/null || true

          if [ "$HTTP" = "200" ]; then
            echo "Initiatives executed successfully"
          else
            echo "Unexpected HTTP $HTTP"
            exit 1
          fi
