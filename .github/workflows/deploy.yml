name: Deploy to Timeweb Cloud

# Timeweb Cloud auto-deploy включён (is_auto_deploy: true)
# Деплой запускается автоматически через webhook при push в main
# Этот workflow синхронизирует env vars и проверяет статус деплоя
#
# Quality gate: runs only after CI workflow succeeds on main.
# Manual dispatch (workflow_dispatch) bypasses the CI gate.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Sync ALL env vars to Timeweb
        run: |
          APP_ID="159529"
          TOKEN="${{ secrets.TIMEWEB_TOKEN }}"

          if [ -z "$TOKEN" ]; then
            echo "TIMEWEB_TOKEN not set — skip env sync"
            exit 0
          fi

          # Строим JSON массив только из переменных которые реально заданы
          ENVS="["
          FIRST=1

          add_env() {
            local NAME="$1"
            local VALUE="$2"
            if [ -n "$VALUE" ]; then
              if [ "$FIRST" = "0" ]; then ENVS="$ENVS,"; fi
              ENVS="$ENVS{\"name\":\"$NAME\",\"value\":\"$VALUE\"}"
              FIRST=0
            fi
          }

          add_env "ANTHROPIC_API_KEY"    "${{ secrets.ANTHROPIC_API_KEY }}"
          add_env "MINIMAX_API_KEY"      "${{ secrets.MINIMAX_API_KEY }}"
          add_env "XAI_API_KEY"          "${{ secrets.XAI_API_KEY }}"
          add_env "DEEPSEEK_API_KEY"     "${{ secrets.DEEPSEEK_API_KEY }}"
          add_env "OPENROUTER_API_KEY"   "${{ secrets.OPENROUTER_API_KEY }}"
          add_env "DATABASE_URL"         "${{ secrets.DATABASE_URL }}"
          add_env "DATABASE_SSL"         "${{ secrets.DATABASE_SSL }}"
          add_env "JWT_SECRET"           "${{ secrets.JWT_SECRET }}"
          add_env "NEXTAUTH_SECRET"      "${{ secrets.NEXTAUTH_SECRET }}"
          add_env "NEXTAUTH_URL"         "${{ secrets.NEXTAUTH_URL }}"
          add_env "NEXT_PUBLIC_APP_URL"  "${{ secrets.NEXT_PUBLIC_APP_URL }}"
          add_env "SMTP_HOST"            "${{ secrets.SMTP_HOST }}"
          add_env "SMTP_PORT"            "${{ secrets.SMTP_PORT }}"
          add_env "NODE_ENV"             "production"

          ENVS="$ENVS]"

          if [ "$FIRST" = "1" ]; then
            echo "No env vars to sync — all secrets empty"
            exit 0
          fi

          echo "Syncing env vars to Timeweb app $APP_ID..."

          HTTP=$(curl -s -o /tmp/env_response.json -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"envs\":$ENVS}" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID/envs")

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ] || [ "$HTTP" = "204" ]; then
            echo "✅ Env vars synced to Timeweb (HTTP $HTTP)"
          else
            echo "⚠️  Env sync returned HTTP $HTTP"
            cat /tmp/env_response.json 2>/dev/null || true
            echo ""
            echo "Переменные можно выставить вручную: https://timeweb.cloud/my/apps/$APP_ID/settings"
          fi

      - name: Check deploy status
        run: |
          APP_ID="159529"
          TOKEN="${{ secrets.TIMEWEB_TOKEN }}"

          if [ -z "$TOKEN" ]; then
            echo "TIMEWEB_TOKEN not set — skip status check"
            echo "Deploy runs automatically via Timeweb webhook"
            exit 0
          fi

          echo "Checking Timeweb app $APP_ID status..."

          HTTP=$(curl -s -o /tmp/app_status.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.timeweb.cloud/api/v1/apps/$APP_ID")

          if [ "$HTTP" = "200" ]; then
            STATUS=$(python3 -c "import json; d=json.load(open('/tmp/app_status.json')); print(d['app']['status'])" 2>/dev/null || echo "unknown")
            COMMIT=$(python3 -c "import json; d=json.load(open('/tmp/app_status.json')); print(d['app']['commit_sha'][:7])" 2>/dev/null || echo "unknown")
            echo "Status: $STATUS | Commit: $COMMIT"
          else
            echo "Could not check status (HTTP $HTTP) — deploy still runs via webhook"
          fi

          echo "Site: https://pospkam-pospktry-c1f3.twc1.net"
