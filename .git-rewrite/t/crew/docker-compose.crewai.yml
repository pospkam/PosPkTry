version: '3.8'
# Standalone compose для запуска только CrewAI агента.
# Для полного стека используй корневой docker-compose.yml — сервис crewai уже включён туда.
# Запуск только агента: docker compose -f crew/docker-compose.crewai.yml up

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: crewai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kamhub
      POSTGRES_USER: kamuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kampass2024_local}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - crewai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kamuser -d kamhub']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crewai_network

  redis:
    image: redis:7-alpine
    container_name: crewai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password_local}
    volumes:
      - crewai_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_password_local}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crewai_network

  crewai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kamhub-crewai
    restart: unless-stopped
    working_dir: /crew
    volumes:
      - .:/crew
    ports:
      - '8001:8001'
    environment:
      DATABASE_URL: postgresql://kamuser:${DB_PASSWORD:-kampass2024_local}@postgres:5432/kamhub
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password_local}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - crewai_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  crewai_postgres_data:
    driver: local
  crewai_redis_data:
    driver: local

networks:
  crewai_network:
    driver: bridge
